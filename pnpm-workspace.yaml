# Neue Paketversionen erst übernehmen, wenn sie mindestens einen Tag alt sind
# (Schutz vor kompromittierten Releases; neuere pnpm-Versionen prüfen das ohnehin).
minimumReleaseAge: 1440

# Pakete, die beim Installieren etwas bauen dürfen. allowBuilds gilt ab pnpm 11, die anderen beiden für pnpm 10.
# better-sqlite3 bringt fertige Binärdateien für macOS, Linux und Windows mit (prebuilds/) – nichts zu kompilieren.
# Ohne diesen Eintrag würde pnpm 10 „node-gyp rebuild“ starten, was ohne Compiler scheitert.
allowBuilds:
  esbuild: true
  better-sqlite3: false
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - better-sqlite3

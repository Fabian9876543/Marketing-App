# Neue Paketversionen erst übernehmen, wenn sie mindestens einen Tag alt sind
# (Schutz vor kompromittierten Releases; neuere pnpm-Versionen prüfen das ohnehin).
minimumReleaseAge: 1440

# Pakete, die beim Installieren etwas bauen dürfen (better-sqlite3: SQLite, esbuild: tsx/Vite).
# allowBuilds gilt ab pnpm 11, onlyBuiltDependencies für pnpm 10.
allowBuilds:
  better-sqlite3: true
  esbuild: true
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
